name: Source checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall -q bot.py bot_instance.py config.py token_api.py database handlers keyboards message middlewares states utils tests
      - run: python -m unittest discover -s tests -v
